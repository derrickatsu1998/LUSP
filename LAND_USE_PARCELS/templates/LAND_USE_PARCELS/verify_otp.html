<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - GSSM_LUSP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .otp-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .otp-card .icon {
            text-align: center;
            font-size: 3rem;
            color: #0f2b24;
            margin-bottom: 8px;
        }
        .otp-card h2 {
            text-align: center;
            font-weight: 700;
            color: #0f2b24;
        }
        .otp-card p.sub {
            text-align: center;
            color: #4a5568;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .otp-input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
        }
        .otp-input-group input {
            width: 50px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            transition: border-color 0.2s;
        }
        .otp-input-group input:focus {
            border-color: #0f2b24;
            outline: none;
            box-shadow: 0 0 0 3px rgba(15,43,36,0.15);
        }
        .btn-primary {
            background: #0f2b24;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #1a4a3c;
        }
        .resend-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
        }
        .resend-link a {
            color: #0f2b24;
            text-decoration: none;
            font-weight: 600;
        }
        .resend-link a:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 12px;
        }
        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #718096;
        }
        .footer-text a {
            color: #0f2b24;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="otp-card">
        <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h2>Verify OTP</h2>
        <p class="sub">Enter the 6‑digit code sent to your email</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="otp-input-group">
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" required />
            </div>
            <input type="hidden" name="otp" id="otpHidden" />
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-2"></i> Verify OTP
            </button>
        </form>

        <div class="resend-link">
            <a href="{% url 'request_otp' %}">Resend OTP</a>
        </div>
        <div class="footer-text">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>

    <script>
        // Auto-advance OTP inputs
        document.querySelectorAll('.otp-input').forEach((input, idx, arr) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && idx < arr.length - 1) {
                    arr[idx + 1].focus();
                }
                updateOtpHidden();
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && idx > 0) {
                    arr[idx - 1].focus();
                }
            });
        });

        function updateOtpHidden() {
            const inputs = document.querySelectorAll('.otp-input');
            const otp = Array.from(inputs).map(i => i.value).join('');
            document.getElementById('otpHidden').value = otp;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
