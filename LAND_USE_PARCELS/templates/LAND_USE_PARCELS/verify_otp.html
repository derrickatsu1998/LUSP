<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - GSSM_LUSP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=1600') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .otp-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .otp-card .icon {
            text-align: center;
            font-size: 4rem;
            color: #0f2b24;
            margin-bottom: 8px;
        }
        /* Globe spin animation */
        .icon .bi-globe {
            display: inline-block;
            animation: spinGlobe 10s linear infinite;
        }
        @keyframes spinGlobe {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .otp-card h2 {
            text-align: center;
            font-weight: 700;
            color: #0f2b24;
        }
        .otp-card p.sub {
            text-align: center;
            color: #4a5568;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .otp-input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
        }
        .otp-input-group input {
            width: 50px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .otp-input-group input:focus {
            border-color: #0f2b24;
            outline: none;
            box-shadow: 0 0 0 3px rgba(15,43,36,0.15);
        }
        .otp-input-group input.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220,53,69,0.25);
        }
        .btn-primary {
            background: #0f2b24;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #1a4a3c;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .resend-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
        }
        .resend-link a {
            color: #0f2b24;
            text-decoration: none;
            font-weight: 600;
        }
        .resend-link a:hover {
            text-decoration: underline;
        }
        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #718096;
        }
        /* Toast container */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
        }
        .toast {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .toast .toast-body {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast .toast-body i {
            font-size: 1.5rem;
        }
        .toast-success .toast-body i { color: #198754; }
        .toast-error .toast-body i { color: #dc3545; }
        .toast-warning .toast-body i { color: #ffc107; }
        .toast-info .toast-body i { color: #0dcaf0; }
    </style>
</head>
<body>

    <!-- Toast container for Django messages -->
    <div class="toast-container" id="toastContainer">
        {% if messages %}
            {% for message in messages %}
                <div class="toast show align-items-center border-0 toast-{{ message.tags }}" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                    <div class="toast-body">
                        <i class="bi bi-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}x-circle{% elif message.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="otp-card">
        <div class="icon">
            <!-- Globe icon instead of lock -->
            <i class="bi bi-globe"></i>
        </div>
        <h2>Verify OTP</h2>
        <p class="sub">Enter the 6‑digit code sent to your email</p>

        <!-- Static alert for frontend validation errors (hidden by default) -->
        <div id="validationAlert" class="alert alert-danger d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="validationMessage">Please enter a valid 6-digit code.</span>
        </div>

        <form method="post" id="otpForm" novalidate>
            {% csrf_token %}
            <div class="otp-input-group" id="otpGroup">
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" id="otp1" name="otp1" required autofocus />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" id="otp2" name="otp2" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" id="otp3" name="otp3" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" id="otp4" name="otp4" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" id="otp5" name="otp5" required />
                <input type="text" maxlength="1" pattern="[0-9]" class="otp-input" id="otp6" name="otp6" required />
            </div>
            <input type="hidden" name="otp" id="otpHidden" />
            <button type="submit" class="btn btn-primary" id="verifyBtn">
                <i class="bi bi-check-circle me-2"></i> Verify OTP
            </button>
        </form>

        <div class="resend-link">
            <a href="{% url 'request_otp' %}">Resend OTP</a>
        </div>
        <div class="footer-text">
            &copy; BetaCode Software Solutions And Consultancy &bull; All rights reserved
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otpForm');
            const hiddenInput = document.getElementById('otpHidden');
            const verifyBtn = document.getElementById('verifyBtn');
            const validationAlert = document.getElementById('validationAlert');
            const validationMessage = document.getElementById('validationMessage');

            function clearInvalidState() {
                inputs.forEach(inp => inp.classList.remove('is-invalid'));
                validationAlert.classList.add('d-none');
            }

            function showValidationError(msg) {
                validationMessage.textContent = msg || 'Please enter a valid 6-digit code.';
                validationAlert.classList.remove('d-none');
                inputs.forEach(inp => inp.classList.add('is-invalid'));
                for (let inp of inputs) {
                    if (inp.value.length === 0) { inp.focus(); break; }
                }
            }

            function updateOtp() {
                const otp = Array.from(inputs).map(i => i.value).join('');
                hiddenInput.value = otp;
                if (/^\d{6}$/.test(otp)) {
                    clearInvalidState();
                }
                const allFilled = inputs.every(i => i.value.length === 1);
                verifyBtn.disabled = !allFilled;
                if (allFilled && !validationAlert.classList.contains('d-none')) {
                    clearInvalidState();
                }
            }

            inputs.forEach((input, idx, arr) => {
                input.addEventListener('input', function(e) {
                    this.value = this.value.replace(/\D/g, '');
                    if (this.value.length > 1) {
                        this.value = this.value.slice(0, 1);
                    }
                    if (this.value.length === 1 && idx < arr.length - 1) {
                        arr[idx + 1].focus();
                    }
                    updateOtp();
                    clearInvalidState();
                });

                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0 && idx > 0) {
                        arr[idx - 1].focus();
                    }
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        form.dispatchEvent(new Event('submit'));
                    }
                });

                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = pasted.replace(/\D/g, '').slice(0, 6);
                    if (digits.length > 0) {
                        for (let i = 0; i < digits.length && i < arr.length; i++) {
                            arr[i].value = digits[i];
                        }
                        const nextEmpty = Array.from(arr).findIndex(inp => inp.value.length === 0);
                        if (nextEmpty !== -1) {
                            arr[nextEmpty].focus();
                        } else {
                            arr[arr.length - 1].focus();
                        }
                        updateOtp();
                        clearInvalidState();
                    }
                });
            });

            form.addEventListener('submit', function(e) {
                const otp = hiddenInput.value;
                if (!/^\d{6}$/.test(otp)) {
                    e.preventDefault();
                    showValidationError('Please enter exactly 6 digits.');
                    return;
                }
                clearInvalidState();
                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Verifying...';
                setTimeout(() => {
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i> Verify OTP';
                }, 10000);
            });

            inputs.forEach((input, idx, arr) => {
                input.addEventListener('input', function() {
                    const allFilled = arr.every(i => i.value.length === 1);
                    if (allFilled && /^\d{6}$/.test(hiddenInput.value)) {
                        clearInvalidState();
                        setTimeout(() => {
                            form.dispatchEvent(new Event('submit'));
                        }, 400);
                    }
                });
            });

            updateOtp();
            document.addEventListener('DOMContentLoaded', function() {
                clearInvalidState();
            });
        })();
    </script>
</body>
</html>
