<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La-Dadekotopon Survey – Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 100%;
            transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        .login-card .logo {
            font-size: 3.5rem;
            color: #2d6a4f;
            text-align: center;
            margin-bottom: 10px;
        }
        .login-card h4 {
            font-weight: 700;
            color: #1e293b;
            text-align: center;
        }
        .login-card p {
            color: #64748b;
            text-align: center;
            font-size: 0.95rem;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
        }
        .btn-primary {
            background: #2d6a4f;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
            width: 100%;
        }
        .btn-primary:hover {
            background: #1b4332;
            transform: scale(1.02);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
        }
        .alert {
            border-radius: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <i class="bi bi-map-fill"></i>
    </div>
    <h4>Group_10_LUSP_Data_Form</h4>
    <p>Enter your registered email to receive a one‑time passcode.</p>

    <form id="otpRequestForm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="emailInput" class="form-label">Email address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" name="email" id="emailInput" class="form-control" placeholder="your@email.com" required>
            </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary">
            <span id="btnText">Send OTP</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
        <div id="messageContainer" class="mt-3"></div>
    </form>
    <div class="footer">
        <i class="bi bi-shield-lock-fill"></i> Secure &bull; Powered by BetaCode Software Solutions and Consultancy
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(document).ready(function() {
    $('#otpRequestForm').on('submit', function(e) {
        e.preventDefault();
        const $btn = $('#submitBtn');
        const $text = $('#btnText');
        const $spinner = $('#btnSpinner');
        const $msg = $('#messageContainer');

        // Disable button and show spinner
        $btn.prop('disabled', true);
        $text.text('Sending...');
        $spinner.removeClass('d-none');

        $.ajax({
            url: '/request-otp/',
            type: 'POST',
            data: $(this).serialize(),
            success: function(res) {
                $msg.html('<div class="alert alert-success">✅ ' + res.message + ' Check your terminal for the OTP.</div>');
                setTimeout(function() {
                    window.location.href = '/verify-otp/';
                }, 2000);
            },
            error: function(xhr) {
                let errorMsg = '❌ Failed to send OTP.';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMsg = xhr.responseJSON.message;
                }
                $msg.html('<div class="alert alert-danger">' + errorMsg + '</div>');
                // Re-enable button
                $btn.prop('disabled', false);
                $text.text('Send OTP');
                $spinner.addClass('d-none');
            }
        });
    });
});
</script>
</body>
</html>
