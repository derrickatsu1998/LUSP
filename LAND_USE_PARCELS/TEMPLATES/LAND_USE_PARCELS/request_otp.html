<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sign In - Land Use App</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { margin-top: 0; color: #2d3748; }
        .form-group { margin-bottom: 16px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1b4332; }
        .message { padding: 10px; border-radius: 8px; margin-top: 12px; display: none; }
        .message.error { display: block; background: #fee; color: #c00; }
        .message.success { display: block; background: #efe; color: #0a0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 LandUse</h1>
        <p>Sign in to access the map</p>

        <form method="post" id="otpForm">
            {% csrf_token %}
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Enter your email" required autofocus>
            </div>
            <button type="submit" id="submitBtn">Send OTP</button>
            <div id="message" class="message"></div>
        </form>
    </div>

    <script>
        // Simple, reliable JavaScript
        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msg = document.getElementById('message');

            if (!email) {
                msg.textContent = 'Please enter your email.';
                msg.className = 'message error';
                return;
            }

            fetch('/request-otp/', {
                method: 'POST',
                body: new FormData(this),
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    msg.textContent = '✅ OTP sent! Check your email.';
                    msg.className = 'message success';
                } else {
                    msg.textContent = '❌ ' + (data.error || 'Error');
                    msg.className = 'message error';
                }
            })
            .catch(() => {
                msg.textContent = '❌ Network error.';
                msg.className = 'message error';
            });
        });
    </script>
</body>
</html>
