<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Land Use App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 28px; color: #2d3748; }
        .logo h1 span { color: #667eea; }
        .logo p { color: #718096; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #2d3748; margin-bottom: 6px; font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .message.success { display: block; background: #f0fff4; color: #38a169; border: 1px solid #c6f6d5; }
        .message.error { display: block; background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; }
        .message.info { display: block; background: #ebf8ff; color: #3182ce; border: 1px solid #bee3f8; }
        .footer { text-align: center; margin-top: 24px; font-size: 13px; color: #718096; }
        .footer a { color: #667eea; text-decoration: none; font-weight: 600; }
        @media (max-width: 480px) { .container { padding: 32px 24px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <h1>🌍 Land<span>Use</span></h1>
        <p>Smart Land Management & Planning</p>
    </div>

    <form id="otpForm" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">Send One-Time Password</button>
        <div id="message" class="message"></div>
    </form>

    <div class="footer">
        Need help? <a href="mailto:support@landuse.com">Contact Support</a>
    </div>
</div>

<script>
// Wait for DOM to be fully loaded
(function() {
    // Get elements
    var form = document.getElementById('otpForm');
    var emailInput = document.getElementById('email');
    var submitBtn = document.getElementById('submitBtn');
    var messageDiv = document.getElementById('message');

    // If form doesn't exist, stop
    if (!form) return;

    var isSubmitting = false;

    // Get CSRF token
    function getCSRFToken() {
        var name = 'csrftoken';
        var cookieValue = null;
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.indexOf(name + '=') === 0) {
                cookieValue = cookie.substring(name.length + 1);
                break;
            }
        }
        return cookieValue || '';
    }

    // Focus on email
    if (emailInput) {
        emailInput.focus();
    }

    // Form submit
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        if (isSubmitting) return;

        if (!emailInput) {
            showMessage('Email input not found.', 'error');
            return;
        }

        var email = emailInput.value.trim();

        if (!email) {
            showMessage('Please enter your email address.', 'error');
            return;
        }

        if (!isValidEmail(email)) {
            showMessage('Please enter a valid email address.', 'error');
            return;
        }

        isSubmitting = true;
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
        }
        hideMessage();

        var formData = new FormData(form);
        var csrfToken = getCSRFToken();

        fetch('/request-otp/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': csrfToken
            },
            credentials: 'same-origin'
        })
        .then(function(response) {
            if (response.status === 403) {
                throw new Error('CSRF verification failed. Please refresh and try again.');
            }
            if (!response.ok) {
                throw new Error('Server error: ' + response.status);
            }
            return response.json();
        })
        .then(function(data) {
            isSubmitting = false;
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send One-Time Password';
            }

            if (data.success) {
                showMessage('✅ OTP sent successfully! Check your email.', 'success');
                if (data.redirect_url) {
                    setTimeout(function() {
                        window.location.href = data.redirect_url;
                    }, 2000);
                }
            } else {
                showMessage('❌ ' + (data.error || 'Failed to send OTP. Please try again.'), 'error');
            }
        })
        .catch(function(error) {
            console.error('Error:', error);
            isSubmitting = false;
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send One-Time Password';
            }
            showMessage('❌ ' + error.message, 'error');
        });
    });

    function showMessage(text, type) {
        if (!messageDiv) return;
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + (type || 'info');
        messageDiv.style.display = 'block';
    }

    function hideMessage() {
        if (!messageDiv) return;
        messageDiv.style.display = 'none';
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }
})();
</script>

</body>
</html>
