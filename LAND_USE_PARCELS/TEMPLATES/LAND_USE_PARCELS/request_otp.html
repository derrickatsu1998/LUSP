    <script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('otpForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const otpTimerDiv = document.getElementById('otpTimer');
    const timerCountdown = document.getElementById('timerCountdown');
    const resendBtn = document.getElementById('resendBtn');

    let countdownInterval = null;
    let isSubmitting = false;

    const urlParams = new URLSearchParams(window.location.search);
    const nextUrl = urlParams.get('next');

    // Get CSRF token from the form's hidden input
    function getCSRFToken() {
        const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
        if (csrfInput) {
            return csrfInput.value;
        }
        const cookieValue = document.cookie
            .split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
        return cookieValue || '';
    }

    if (emailInput) {
        emailInput.focus();
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        if (isSubmitting) return;

        const email = emailInput.value.trim();

        if (!email) {
            showMessage('Please enter your email address.', 'error');
            return;
        }

        if (!isValidEmail(email)) {
            showMessage('Please enter a valid email address.', 'error');
            return;
        }

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Sending...';
        hideMessage();

        const formData = new FormData(form);
        const csrfToken = getCSRFToken();
        
        console.log('CSRF Token:', csrfToken);
        
        fetch('/request-otp/', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': csrfToken
            },
            credentials: 'same-origin'
        })
        .then(response => {
            if (response.status === 403) {
                throw new Error('CSRF verification failed. Please refresh and try again.');
            }
            if (!response.ok) {
                throw new Error('Server error: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.textContent = '🔑 Send One-Time Password';

            if (data.success) {
                showMessage('✅ OTP sent successfully! Check your email.', 'success');
                startCountdown(60);
                if (data.redirect_url) {
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 2000);
                }
            } else {
                showMessage('❌ ' + (data.error || 'Failed to send OTP. Please try again.'), 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.textContent = '🔑 Send One-Time Password';
            showMessage('❌ ' + error.message, 'error');
        });
    });

    resendBtn.addEventListener('click', function() {
        if (!resendBtn.disabled) {
            form.dispatchEvent(new Event('submit'));
        }
    });

    function showMessage(text, type = 'info') {
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + type;
        messageDiv.style.display = 'block';
    }

    function hideMessage() {
        messageDiv.style.display = 'none';
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function startCountdown(seconds) {
        let remaining = seconds;
        otpTimerDiv.style.display = 'block';
        timerCountdown.textContent = remaining;
        resendBtn.disabled = true;

        if (countdownInterval) {
            clearInterval(countdownInterval);
        }

        countdownInterval = setInterval(() => {
            remaining--;
            timerCountdown.textContent = remaining;

            if (remaining <= 0) {
                clearInterval(countdownInterval);
                resendBtn.disabled = false;
                timerCountdown.textContent = '0';
            }
        }, 1000);
    }

    if (nextUrl) {
        showMessage('Please sign in to continue.', 'info');
    }
});
</script>
</body>
</html>
