<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #2d3748; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { border-color: #667eea; outline: none; }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #5a6fd6; }
        .message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: 500;
        }
        .message.success { display: block; background: #d4edda; color: #155724; }
        .message.error { display: block; background: #f8d7da; color: #721c24; }
        .footer { text-align: center; margin-top: 20px; color: #718096; font-size: 14px; }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 LandUse</h1>
    <p class="subtitle">Smart Land Management &amp; Planning</p>

    <form id="otpForm" method="post" action="/request-otp/">
        {% csrf_token %}
        <div class="form-group">
            <input type="email" id="email" name="email" placeholder="Enter your email address" required autofocus>
        </div>
        <button type="submit" id="submitBtn">Send One-Time Password</button>
        <div id="message" class="message"></div>
    </form>

    <div class="footer">
        Need help? <a href="mailto:support@landuse.com">Contact Support</a>
    </div>
</div>

<script>
// Simple JavaScript - guaranteed to work
(function() {
    // Get elements
    var form = document.getElementById('otpForm');
    var email = document.getElementById('email');
    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('message');

    // Only proceed if form exists
    if (!form) {
        console.error('Form not found!');
        return;
    }

    console.log('Form found, initializing...');

    // Get CSRF token
    function getCsrf() {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var c = cookies[i].trim();
            if (c.indexOf('csrftoken=') === 0) {
                return c.substring('csrftoken='.length);
            }
        }
        return '';
    }

    // Form submit
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        var val = email.value.trim();
        if (!val) {
            msg.textContent = 'Please enter your email address.';
            msg.className = 'message error';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending...';
        msg.style.display = 'none';

        var data = new FormData(form);
        var token = getCsrf();

        fetch('/request-otp/', {
            method: 'POST',
            body: data,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': token
            },
            credentials: 'same-origin'
        })
        .then(function(res) {
            return res.json();
        })
        .then(function(data) {
            btn.disabled = false;
            btn.textContent = 'Send One-Time Password';

            if (data.success) {
                msg.textContent = '✅ OTP sent! Check your email.';
                msg.className = 'message success';
                if (data.redirect_url) {
                    setTimeout(function() {
                        window.location.href = data.redirect_url;
                    }, 2000);
                }
            } else {
                msg.textContent = '❌ ' + (data.error || 'Failed to send OTP.');
                msg.className = 'message error';
            }
        })
        .catch(function(err) {
            btn.disabled = false;
            btn.textContent = 'Send One-Time Password';
            msg.textContent = '❌ Network error. Please try again.';
            msg.className = 'message error';
            console.error('Error:', err);
        });
    });
})();
</script>

</body>
</html>
